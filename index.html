
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FILOTASK - Dictado por voz</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  margin: 0;
  padding: 25px;
  color: #243247;
}
.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #0001;
}
h2 { margin-top: 0; }
textarea {
  width: 100%;
  min-height: 150px;
  box-sizing: border-box;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
}
button {
  padding: 12px 18px;
  margin: 10px 6px 10px 0;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  background: #1769aa;
  color: white;
}
button:disabled { opacity: .45; cursor: not-allowed; }
#status { margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h2>🎙️ FILOTASK | Dictado</h2>
  <p>Presioná iniciar y hablá. Cuando termines, presioná detener.</p>

  <textarea id="texto" placeholder="El texto dictado aparecerá aquí..."></textarea>

  <div>
    <button id="iniciar">🎙️ Iniciar dictado</button>
    <button id="detener" disabled>Detener</button>
    <button id="enviar">Enviar a FILOTASK</button>
  </div>

  <div id="status">Estado: listo para comenzar</div>
</div>

<script>
const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

const texto = document.getElementById("texto");
const status = document.getElementById("status");
const iniciar = document.getElementById("iniciar");
const detener = document.getElementById("detener");

let recognition;
let escuchando = false;

if (!SpeechRecognition) {
  status.textContent =
    "Este navegador no admite reconocimiento de voz. Usá Google Chrome.";
  iniciar.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = "es-AR";
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    escuchando = true;
    iniciar.disabled = true;
    detener.disabled = false;
    status.textContent = "🔴 Escuchando...";
  };

  recognition.onresult = (event) => {
    let definitivo = "";
    let parcial = "";

    for (let i = 0; i < event.results.length; i++) {
      const resultado = event.results[i];
      if (resultado.isFinal) {
        definitivo += resultado[0].transcript + " ";
      } else {
        parcial += resultado[0].transcript;
      }
    }

    if (definitivo) {
      texto.value = (texto.dataset.guardado || "") + definitivo;
      texto.dataset.guardado = texto.value;
    }

    status.textContent = parcial
      ? "Escuchando: " + parcial
      : "🔴 Escuchando...";
  };

  recognition.onerror = (event) => {
    status.textContent = "Error de dictado: " + event.error;
  };

  recognition.onend = () => {
    escuchando = false;
    iniciar.disabled = false;
    detener.disabled = true;
    texto.dataset.guardado = texto.value;
    status.textContent = "Dictado detenido.";
  };
}

iniciar.onclick = () => {
  if (!recognition || escuchando) return;
  texto.dataset.guardado = texto.value;
  try {
    recognition.start();
  } catch (error) {
    status.textContent = "No se pudo iniciar: " + error.message;
  }
};

detener.onclick = () => {
  if (recognition && escuchando) recognition.stop();
};

document.getElementById("enviar").onclick = () => {
  const contenido = texto.value.trim();

  if (!contenido) {
    status.textContent = "Primero dictá o escribí algo.";
    return;
  }

  if (window.opener && !window.opener.closed) {
    window.opener.postMessage({
      tipo: "FILOTASK_DICTADO",
      texto: contenido
    }, "*");

    status.textContent = "Texto enviado a FILOTASK.";
  } else {
    status.textContent =
      "Dictado guardado aquí. Esta ventana todavía no está conectada a FILOTASK.";
  }
};
</script>
</body>
</html>
